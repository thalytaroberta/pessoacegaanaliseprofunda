<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pessoa Cega: Análise Profunda — Dossiê Acadêmico sobre Deficiência Visual</title>
  <meta name="description" content="Pesquisa acadêmica, histórica, científica e documental sobre deficiência visual em 60 Módulos de Estudo.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN (apenas para utilitários CSS — não afeta JS) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- MARKED LIBRARY LOCAL (sem CDN externo) -->
  <script src="js/marked.local.js"></script>

  <!-- DATABASE LOCAL (todos os 60 módulos embutidos) -->
  <script src="js/db-data.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col" style="font-family: Inter, sans-serif;">

  <!-- SKIP LINK -->
  <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold z-50 shadow-xl">
    Ir para o conteúdo principal
  </a>

  <!-- HEADER -->
  <header style="position:sticky;top:0;z-index:40;background:rgba(15,23,42,0.95);border-bottom:1px solid #1e293b;backdrop-filter:blur(12px);">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" style="height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;">
      
      <!-- LOGO / BRAND -->
      <button type="button" id="btn-home"
        style="display:flex;align-items:center;gap:12px;background:none;border:none;cursor:pointer;padding:4px;border-radius:12px;outline:none;">
        <div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#10b981);display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 16px rgba(79,70,229,0.3);">
          👁️
        </div>
        <div style="text-align:left;">
          <div style="font-family:Outfit,sans-serif;font-weight:800;font-size:18px;color:#fff;display:flex;align-items:center;gap:8px;">
            PESSOA CEGA
            <span style="background:rgba(99,102,241,0.2);color:#818cf8;border:1px solid rgba(99,102,241,0.3);font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:0.05em;">ANÁLISE PROFUNDA</span>
          </div>
          <div style="font-size:11px;color:#64748b;margin-top:-2px;">Dossiê Acadêmico • 60 Módulos de Estudo</div>
        </div>
      </button>

      <!-- SEARCH BAR -->
      <div style="flex:1;max-width:500px;margin:0 16px;position:relative;" class="hidden md:block">
        <div style="position:relative;">
          <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#64748b;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text" id="global-search" placeholder="Pesquisar módulo, tópico, lei, Louis Braille, Pernambuco..."
            style="width:100%;background:#020617;border:1px solid #1e293b;border-radius:12px;padding:8px 16px 8px 40px;font-size:13px;color:#e2e8f0;outline:none;box-sizing:border-box;transition:border-color 0.2s;"
            onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#1e293b'">
        </div>
        <div id="search-dropdown" style="display:none;position:absolute;top:calc(100%+8px);left:0;right:0;background:#0f172a;border:1px solid #1e293b;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.8);max-height:380px;overflow-y:auto;z-index:50;"></div>
      </div>

      <!-- NAV BUTTONS -->
      <div style="display:flex;align-items:center;gap:8px;">
        <button type="button" id="btn-audio"
          style="padding:8px 12px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;color:#cbd5e1;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;"
          onmouseover="this.style.borderColor='#475569'" onmouseout="this.style.borderColor='#1e293b'"
          title="Ler módulo em voz alta">
          🔊 <span class="hidden sm:inline">Ouvir</span>
        </button>

        <button type="button" id="btn-pdf"
          style="padding:8px 12px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;color:#cbd5e1;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all 0.2s;"
          onmouseover="this.style.borderColor='#475569'" onmouseout="this.style.borderColor='#1e293b'"
          title="Imprimir / Exportar PDF">
          🖨️ <span class="hidden sm:inline">PDF</span>
        </button>

        <button type="button" id="btn-syntheses"
          style="padding:8px 14px;background:#4f46e5;border:none;border-radius:12px;color:#fff;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 16px rgba(79,70,229,0.3);transition:background 0.2s;"
          onmouseover="this.style.background='#6366f1'" onmouseout="this.style.background='#4f46e5'">
          📚 <span>Sínteses Finais</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MOBILE SEARCH -->
  <div class="md:hidden" style="background:#0f172a;border-bottom:1px solid #1e293b;padding:12px 16px;">
    <div style="position:relative;">
      <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#64748b;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
      </svg>
      <input type="text" id="mobile-search" placeholder="Pesquisar em todos os 60 módulos..."
        style="width:100%;background:#020617;border:1px solid #1e293b;border-radius:12px;padding:8px 16px 8px 40px;font-size:13px;color:#e2e8f0;outline:none;box-sizing:border-box;"
        onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#1e293b'">
    </div>
  </div>

  <!-- MAIN LAYOUT -->
  <div style="flex:1;width:100%;max-width:1280px;margin:0 auto;display:flex;">

    <!-- SIDEBAR (desktop only) -->
    <aside id="sidebar" style="width:280px;flex-shrink:0;background:rgba(15,23,42,0.5);border-right:1px solid #1e293b;display:none;flex-direction:column;height:calc(100vh - 64px);position:sticky;top:64px;overflow-y:auto;padding:16px;gap:12px;" class="lg:flex">
      <div>
        <div style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:8px;">Índice dos 60 Módulos</div>
        <input type="text" id="sidebar-filter" placeholder="Filtrar módulos..."
          style="width:100%;background:#020617;border:1px solid #1e293b;border-radius:8px;padding:6px 12px;font-size:11px;color:#cbd5e1;outline:none;box-sizing:border-box;margin-bottom:8px;"
          onfocus="this.style.borderColor='#6366f1'" onblur="this.style.borderColor='#1e293b'">
      </div>
      <div id="sidebar-list" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;"></div>
    </aside>

    <!-- MAIN READING AREA -->
    <main id="main" style="flex:1;padding:24px;min-width:0;overflow-y:auto;" class="sm:p-8 lg:p-10">
      <!-- Content injected here -->
      <div style="text-align:center;padding:60px 20px;color:#64748b;">
        <div style="font-size:48px;margin-bottom:16px;">📖</div>
        <div style="font-size:18px;font-weight:600;color:#94a3b8;">Carregando enciclopédia...</div>
      </div>
    </main>

  </div>

  <!-- FOOTER -->
  <footer style="background:#0f172a;border-top:1px solid #1e293b;padding:24px 16px;text-align:center;font-size:12px;color:#64748b;">
    Pessoa Cega: Análise Profunda — Pesquisa Acadêmica, Histórica e Científica sobre Deficiência Visual<br>
    Pernambuco, Brasil © 2026 &bull; 60 Módulos de Estudo Integral
  </footer>

  <!-- APP LOGIC LAST (after all data scripts) -->
  <script src="js/app.js"></script>
</body>
</html>
