<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pessoa Cega: Análise Profunda — Dossiê Acadêmico e Enciclopédia da Deficiência Visual</title>
  <meta name="description" content="Pesquisa acadêmica, histórica, científica e documental extremamente aprofundada sobre a pessoa com deficiência visual em 60 Módulos de Estudo.">

  <!-- Google Fonts: Inter & Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Marked Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-full flex flex-col selection:bg-indigo-600 selection:text-white">

  <!-- SKIP LINK -->
  <a href="#main-reading-area" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold z-50 shadow-xl focus:outline-none focus:ring-4 focus:ring-indigo-400">
    Ir para a leitura do módulo
  </a>

  <!-- TOP HEADER NAVBAR -->
  <header class="sticky top-0 z-40 bg-slate-900/90 border-b border-slate-800/90 backdrop-blur-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <a href="#/" class="flex items-center gap-3 group focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded-xl p-1">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-emerald-500 text-white flex items-center justify-center font-heading font-black text-xl shadow-lg shadow-indigo-600/30">
          👁️
        </div>
        <div>
          <h1 class="font-heading font-extrabold text-lg sm:text-xl tracking-tight text-white flex items-center gap-2">
            PESSOA CEGA <span class="bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">Análise Profunda</span>
          </h1>
          <span class="text-xs text-slate-400 block -mt-1">Dossiê Acadêmico • 60 Módulos de Estudo</span>
        </div>
      </a>

      <!-- Global Live Search -->
      <div class="flex-1 max-w-lg mx-4 relative hidden md:block">
        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input type="text" id="encyclopedia-search" placeholder="Pesquisar módulo, tópico, lei, Louis Braille, Pernambuco..." 
                 class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/40 transition">
        </div>
        <div id="search-results-box" class="hidden absolute top-full left-0 right-0 mt-2 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden max-h-96 overflow-y-auto z-50"></div>
      </div>

      <!-- Quick Actions -->
      <div class="flex items-center gap-2">
        <button id="btn-audio-read" class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 text-xs font-semibold text-slate-300 hover:text-white transition flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" title="Ler módulo atual em voz alta">
          <i data-lucide="volume-2" class="w-4 h-4 text-indigo-400"></i>
          <span class="hidden sm:inline">Ouvir</span>
        </button>

        <button id="btn-pdf-print" class="px-3 py-2 rounded-xl bg-slate-900 border border-slate-800 hover:border-slate-700 text-xs font-semibold text-slate-300 hover:text-white transition flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500" title="Imprimir / Exportar PDF">
          <i data-lucide="printer" class="w-4 h-4 text-emerald-400"></i>
          <span class="hidden sm:inline">PDF</span>
        </button>

        <a href="#/sinteses" class="px-3 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30 flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <i data-lucide="book-open" class="w-4 h-4"></i>
          <span>Sínteses Finais</span>
        </a>
      </div>

    </div>
  </header>

  <!-- MOBILE SEARCH BAR -->
  <div class="md:hidden bg-slate-900 border-b border-slate-800 p-3">
    <div class="relative">
      <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
      <input type="text" id="mobile-encyclopedia-search" placeholder="Pesquisar em todos os 60 módulos..." 
             class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500">
    </div>
  </div>

  <!-- MAIN STUDY CONTAINER -->
  <div class="flex-1 w-full max-w-7xl mx-auto flex">
    
    <!-- LEFT SIDEBAR: DIRECT MODULE & TOPIC INDEX -->
    <aside id="study-sidebar" class="w-72 bg-slate-900/50 border-r border-slate-800/80 flex-shrink-0 hidden lg:flex flex-col h-[calc(100vh-4rem)] sticky top-16 overflow-y-auto p-4 space-y-4">
      
      <div>
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Índice dos 60 Módulos</h2>
        <input type="text" id="sidebar-filter" placeholder="Filtrar por número ou nome..." 
               class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-300 placeholder-slate-500 focus:outline-none focus:border-indigo-500 mb-2">
      </div>

      <div class="flex-1 space-y-1 overflow-y-auto text-xs" id="sidebar-module-list">
        <!-- Dynamically injected module list -->
      </div>
    </aside>

    <!-- RIGHT READING AREA -->
    <main id="main-reading-area" class="flex-1 p-4 sm:p-6 lg:p-8 min-w-0 overflow-y-auto">
      <!-- Dynamic study module or catalog rendered here -->
    </main>

  </div>

  <!-- FOOTER -->
  <footer class="bg-slate-900 border-t border-slate-800 py-8 text-slate-400 text-xs text-center">
    <div class="max-w-7xl mx-auto px-4">
      Pessoa Cega: Análise Profunda — Pesquisa Acadêmica, Histórica e Científica sobre Deficiência Visual<br>
      Pernambuco, Brasil © 2026 • 60 Módulos de Estudo Integral
    </div>
  </footer>

  <!-- App Logic -->
  <script src="js/app.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
